"$schema" = 'https://starship.rs/config-schema.json'

# Pure (sindresorhus/pure) replica.
#
# Mirrors the zstyle overrides that used to live in zsh/.zshrc, plus the two
# local tweaks Pure was given there: `prompt_newline=' '` (prompt symbol folded
# onto the preprompt line instead of its own line) and `PROMPT=" $PROMPT"` (one
# leading space). Pure's precmd prints a blank line before every prompt, which
# is what `add_newline` reproduces here.
#
# Colors are ANSI palette indexes so they track the terminal theme exactly the
# way `%F{n}` did: 1 red, 2 green, 4 blue, 5 magenta, 6 cyan, 8 bright black.
#
# Layout:
#   ✦ user@host ~/path branch* rebase ⇣⇡ 42s venv ❯
#
# Spacing rule: modules left of $directory carry a trailing space, modules
# right of it carry a leading space, and $directory itself carries neither.

add_newline = true

format = """ $jobs\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_state\
$cmd_duration\
$conda\
$nix_shell\
$python\
$character"""

# Pure's PROMPT2 is `… %_ ` + the prompt symbol. Starship has no equivalent of
# `%_` (the open shell construct), so the construct name is dropped.
continuation_prompt = '[…](8) [❯](2) '

# ✦ — Pure marks suspended jobs only; Starship counts every background job, so
# a running `foo &` also lights this up.
[jobs]
format = '[$symbol]($style) '
symbol = '✦'
style = '1'
number_threshold = 1
symbol_threshold = 1

# user@host, shown over SSH or as root. Pure also showed it inside containers,
# and rendered root's username in the terminal default color.
[username]
format = '[$user]($style)'
style_user = '8'
style_root = ''
show_always = false

[hostname]
format = '[@$hostname]($style) '
style = '8'
ssh_only = true
ssh_symbol = ''

# Pure uses a bare `%~`: no truncation, no repo-relative rewrite, no read-only
# marker.
[directory]
format = '[$path]($style)'
style = '4'
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = ' [$branch]($style)'
style = '2'
only_attached = true

# Detached HEAD takes the branch slot, matching what vcs_info fed Pure.
[git_commit]
format = ' [$hash$tag]($style)'
style = '2'
only_detached = true
tag_disabled = false

# Pure's "git action" — rebase/merge/etc. Lowercased to read like vcs_info.
# This sits after $git_status rather than before it: Starship packs the dirty
# marker and the ahead/behind arrows into one module, and keeping `*` welded to
# the branch matters more than Pure's action-before-arrows ordering.
[git_state]
format = ' [$state( $progress_current/$progress_total)]($style)'
style = '1'
rebase = 'rebase'
merge = 'merge'
revert = 'revert'
cherry_pick = 'cherry-pick'
bisect = 'bisect'
am = 'am'
am_or_rebase = 'am/rebase'

# One `*` for a dirty tree, glued to the branch, then the arrows.
#
# Every dirty category is a zero-width space so that the conditional group
# renders exactly one visible `*` no matter how many categories are non-empty.
# Do not replace those with '' — an empty variable would stop triggering the
# group. Stash (≡) is omitted because Pure keeps it off unless you opt in with
# `zstyle :prompt:pure:git:stash show yes`.
[git_status]
format = '[(*$conflicted$deleted$renamed$modified$typechanged$staged$untracked)](5)[( $ahead_behind)](6)'
conflicted = '​'
deleted = '​'
renamed = '​'
modified = '​'
typechanged = '​'
staged = '​'
untracked = '​'
stashed = ''
ahead = '⇡'
behind = '⇣'
diverged = '⇣⇡'
up_to_date = ''

# PURE_CMD_MAX_EXEC_TIME defaulted to 5 seconds.
[cmd_duration]
format = ' [$duration]($style)'
style = '8'
min_time = 5000
show_milliseconds = false

# Pure showed a single environment name just left of the prompt symbol, picking
# nix-shell over virtualenv over conda. These are separate modules, so an
# unusual shell with two of them active at once shows both.
[conda]
format = ' [$environment]($style)'
style = '8'
ignore_base = true

[nix_shell]
format = ' [$name]($style)'
style = '8'

# Empty detection lists so this fires on VIRTUAL_ENV alone, like Pure did,
# rather than on the directory containing Python files.
[python]
format = ' [$virtualenv]($style)'
style = '8'
detect_extensions = []
detect_files = []
detect_folders = []

# ❯ green, red after a failure; ❮ in vi command/visual mode.
[character]
format = ' $symbol '
success_symbol = '[❯](2)'
error_symbol = '[❯](1)'
vimcmd_symbol = '[❮](2)'
vimcmd_visual_symbol = '[❮](2)'
vimcmd_replace_symbol = '[❮](2)'
vimcmd_replace_one_symbol = '[❮](2)'
